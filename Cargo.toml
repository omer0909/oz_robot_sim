[package]
name = "scene_test"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19", features = ["debug"] }
avian3d = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version =  "1.2", features = ["preserve_order"] }
bevy_mod_raycast = "0.18"

[features]
default = ["bevy/dynamic_linking"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
